<!doctype html><html><head><meta charset="UTF-8"></head><body><div id="root"></div><pre id="check-result" hidden>pending</pre><script type="module">
import React from 'react';import{createRoot}from'react-dom/client';import App from '/src/App.tsx';import '/src/style.css';import {emptyBusiness} from '/src/businessData.ts';import {collectBackupPreferences} from '/src/backupPreferences.ts';
const calls=[];let id=0;window.isTauri=true;window.__TAURI_INTERNALS__={transformCallback:()=>++id,invoke:async(command)=>{calls.push(command);if(command==='business_load')return {revision:0,data:emptyBusiness()};if(command==='rescan'||command==='apply_app_branding')return;if(command==='clients_initialise')return false;if(command==='calendar_initialise')return {connected:false,meetings:[]};if(command==='get_library')return {items:[],projects:[{id:1,name:'Example project',count:0}],project_folders:[],tags:[],categories:[],sources:[],root:'C:/mock',scanning:false};if(command.startsWith('plugin:event|'))return ++id;if(command==='diagnostics_record'||command==='save_library_preferences')return;if(command==='storage_usage')return {bytes:0,data_bytes:0,app_bytes:0,library_bytes:0};if(command==='diagnostics_read')return {events:[],bytes:0,total:0,dropped:0,failed_writes:0,version:'test',mode:'development'};if(command==='app_version')return 'test';throw Error(command);}};window.__TAURI_EVENT_PLUGIN_INTERNALS__={unregisterListener(){}};
createRoot(document.getElementById('root')).render(React.createElement(App,{startOnHome:false}));const pause=ms=>new Promise(r=>setTimeout(r,ms));async function until(f){for(let i=0;i<300;i++){if(f())return;await pause(20);}throw Error('Timeout');}function assert(f,m){if(!f)throw Error(m);}

const click=text=>{const n=[...document.querySelectorAll('button')].find(b=>b.textContent.trim()===text);assert(n,'Missing '+text);n.click();};
const fill=(label,value)=>{const n=document.querySelector(`[aria-label="${label}"]`);assert(n,'Missing '+label);Object.getOwnPropertyDescriptor(n.tagName==='SELECT'?HTMLSelectElement.prototype:HTMLInputElement.prototype,'value').set.call(n,value);n.dispatchEvent(new Event(n.tagName==='SELECT'?'change':'input',{bubbles:true}));};
const shot=async name=>{window.__captureName=name;window.__screenshotReady=true;await pause(700);};
const customize=async()=>{document.querySelector('[title="Customise app"]').click();await until(()=>document.querySelector('[aria-label="App colour theme"]'));};
const close=async()=>{document.querySelector('[aria-label="Close customisation"]').click();await until(()=>!document.querySelector('.customise-panel'));};
const choose=async id=>{document.querySelector(`[data-customise-tab="${id}"]`)?.click();await pause(80);};
try{
 await until(()=>document.querySelector('[title="Customise app"]'));assert(document.documentElement.dataset.appTheme==='studio','Default unchanged');await customize();assert(document.querySelectorAll('[aria-label="App colour theme"] option').length===45,'44 variants plus Studio default');assert(localStorage.getItem('personal-studio-default'),'Current look captured');fill('App colour theme','dracula-dark');await pause(100);assert(document.documentElement.dataset.appTheme==='dracula-dark','Dark theme applied');click('Use theme colours for all controls');await pause(80);assert(document.documentElement.dataset.themeButtons==='theme','Theme colour defaults');fill('Font arrangement','two');await pause(50);fill('App body font','arial');fill('App heading font','georgia');await pause(70);assert(getComputedStyle(document.querySelector('.customise-panel h1')).fontFamily.includes('Georgia'),'Heading font');assert(getComputedStyle(document.querySelector('.customise-panel button')).fontFamily.includes('Arial'),'Body font');document.querySelector('.theme-controls').scrollIntoView();await shot('branding');
 const tab=id=>[...document.querySelectorAll('[data-custom-tab]')].find(b=>b.textContent.trim()===id);assert(tab('Buttons'),'Buttons still available');tab('Buttons').click();await pause(100);assert(document.querySelectorAll('.cta-style-card').length===100,'100 CTA styles retained');fill('Button main colour','#116688');await pause(80);assert(document.documentElement.dataset.themeButtons==='custom','Explicit button colour overrides theme');assert(getComputedStyle(document.documentElement).getPropertyValue('--cta-primary').trim()==='#116688','Custom colour preserved');fill('buttons colour source','theme');await pause(50);assert(document.documentElement.dataset.themeButtons==='theme','Return buttons to theme');await shot('buttons-dark');
 tab('Tabs').click();await pause(100);assert(document.querySelectorAll('.tab-style-card').length===20,'20 tab styles retained');tab('Sidebar').click();await pause(80);assert(document.querySelector('[aria-label="My Business colour"]')&&document.querySelector('[aria-label="Analytics colour"]'),'New section colours');tab('Icons').click();await pause(80);assert(document.querySelector('.customise-content').textContent.includes('My Business section'),'New icons configurable');tab('Branding').click();await pause(70);await close();document.querySelector('[aria-label="Go to Home"]').click();await pause(120);await shot('home-dark');document.querySelector('[aria-label="My Business"]').click();await pause(50);document.querySelector('#business-sidebar button').click();await until(()=>document.querySelector('.business-page'));await shot('business-dark');document.querySelector('[aria-label="Analytics"]').click();await pause(50);document.querySelector('#analytics-sidebar-reports button').click();await until(()=>document.querySelector('.analytics-page'));await shot('analytics-dark');
 document.querySelector('[aria-label="Settings"]').click();await until(()=>document.getElementById('settings-tab-connections'));assert(!document.getElementById('settings-tab-appearance'),'Appearance removed');document.getElementById('settings-tab-connections').click();await pause(100);assert(document.querySelector('.calendar-brand img').complete,'Calendar logo loaded');await shot('connections-dark');document.getElementById('settings-tab-diagnostics').click();await pause(100);for(const section of ['analytics','business','customise','sidebar','calendar'])assert(document.querySelector(`[aria-label="Diagnostic section"] option[value="${section}"]`),'Diagnostic coverage '+section);
 await customize();fill('App colour theme','catppuccin-light');await pause(100);await shot('light');click('Restore my Studio default');await pause(100);assert(document.documentElement.dataset.appTheme==='studio'&&document.documentElement.dataset.fontMode==='default','Original look restored');assert(collectBackupPreferences()['app-theme'],'Theme included in appearance backup');
 document.getElementById('check-result').textContent=JSON.stringify({ok:true,checks:['44 variants; Studio default capture and restoration','Global dark/light surfaces and paired fonts','Theme/custom precedence and reset','100 buttons and 20 tabs retained','New section colours and icons','Settings cleanup; Calendar logo; new diagnostic sections','Appearance backups']});
}catch(e){document.getElementById('check-result').textContent=JSON.stringify({ok:false,error:String(e),stack:e.stack});}
</script></body></html>
