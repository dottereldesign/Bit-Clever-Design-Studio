<!doctype html><html><head><meta charset="UTF-8"></head><body><main style="max-width:1000px;margin:30px auto"><div id="root"></div></main><pre id="check-result" hidden>pending</pre><script type="module">
import React from 'react';import{createRoot}from'react-dom/client';import Diagnostics from '/src/DiagnosticsPanel.tsx';import {invoke,flushDiagnostics,record,recordingHealth} from '/src/diagnostics.ts';import {setDiagnosticContext,setDiagnosticRecords} from '/src/diagnosticContext.ts';import '/src/style.css';
let failNext=false;let events=[{time:Date.now(),name:'navigation',operation:'test-1',status:'success',duration:123,fields:{view:'project',items:580}},{time:Date.now(),name:'capture_website',operation:'test-2',status:'error',duration:5000,fields:{error_code:'timeout'}}];window.isTauri=true;window.__TAURI_INTERNALS__={invoke:async(command,args)=>{if(command==='diagnostics_record'){if(failNext){failNext=false;throw Error('simulated write failure');}events.push(...args.events.map(e=>({...e,time:Date.now()})));return;}if(command==='diagnostics_read')return {events:[...events].reverse(),total:events.length,bytes:25000,dropped:0,failed_writes:0,version:'test',mode:'development'};if(command==='update')return {};if(command==='test_command')return {added:1};throw Error('Unexpected '+command);}};
createRoot(document.getElementById('root')).render(React.createElement(Diagnostics));const pause=ms=>new Promise(r=>setTimeout(r,ms));const button=name=>[...document.querySelectorAll('button')].find(b=>b.textContent.includes(name));async function until(fn){for(let n=0;n<200;n++){if(fn())return;await pause(20);}throw Error('Timeout');}
try{await until(()=>button('Diagnostics'));button('Diagnostics').click();await until(()=>document.querySelectorAll('.diagnostic-events details').length===2);button('Mark a problem').click();await until(()=>events.some(e=>e.name==='user.problem_mark'));button('Performance').click();await until(()=>document.querySelector('tbody tr'));button('Problems').click();await pause(100);if(!document.body.textContent.includes('capture_website'))throw Error('Missing error');button('Usage').click();await pause(100);button('Activity').click();await pause(100);
await invoke('test_command',{url:'https://private.example/secret',input:{files:[{path:'C:/secret.png'}]}});await flushDiagnostics();if(JSON.stringify(events).includes('private.example')||JSON.stringify(events).includes('secret.png'))throw Error('Sensitive args leaked');if(!events.some(e=>e.name==='test_command'&&e.status==='success'))throw Error('Missing command result');setDiagnosticContext({section:'leads',page:'pipeline'});setDiagnosticRecords([{id:'lead-private',kind:'lead'}]);
await invoke('update',{change:{action:'update_studio',value:JSON.stringify({id:'lead-private',patch:{name:'Secret client',email:'private@example.com'}})}});await flushDiagnostics();
const update=events.find(e=>e.name==='update'&&e.status==='success');if(update?.fields.record_kind!=='lead'||update.fields.field!=='email.name')throw Error('Missing edit context');if(JSON.stringify(events).includes('Secret client')||JSON.stringify(events).includes('private@example.com'))throw Error('CRM contents leaked');
const metadata={count:1};record('immutable','success',0,metadata);metadata.count=9;failNext=true;await flushDiagnostics();if(!recordingHealth().failed)throw Error('Missing transport warning');await flushDiagnostics();if(recordingHealth().failed||!events.some(e=>e.name==='immutable'&&e.fields.count===1))throw Error('Retry or snapshot failed');
for(let n=0;n<14000;n++)events.push({time:Date.now(),name:'benchmark.operation',status:'success',duration:n%100,fields:{section:'research'}});
button('Refresh').click();await until(()=>document.body.textContent.includes('14,0'));button('Performance').click();await until(()=>document.body.textContent.includes('benchmark.operation'));const row=[...document.querySelectorAll('tbody tr')].find(r=>r.textContent.includes('benchmark.operation'));if(!row||!row.textContent.includes('14000')||!row.textContent.includes('94 ms'))throw Error('Large-history aggregation incorrect');if(!document.querySelector('[aria-label="Diagnostic section"] option[value="research"]'))throw Error('Research missing');
window.__screenshotReady=true;await pause(700);document.getElementById('check-result').textContent=JSON.stringify({ok:true,checks:['Activity and all tabs','Problem bookmark','Command outcome','Arguments excluded','CRM context without content','Failed log batch retried','Immutable metadata']});}catch(e){document.getElementById('check-result').textContent=JSON.stringify({ok:false,error:String(e)});}
</script></body></html>
