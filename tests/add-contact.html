window.isTauri=true;window.__TAURI_INTERNALS__={transformCallback:()=>++cb,convertFileSrc:x=>x,invoke:async(command,args)=>{calls.push({command,args});if(command==='client_feed')return library.studio.filter(e=>e.kind==='client_entry').map((e,i)=>({id:i+1,key:e.id,clients:[e.parent],entity:'studio',record:e.id,project:null,title:e.name,before:null,after:{name:e.name,value:e.value,kind:e.kind,service:e.service},action:'update_studio',batch:'fixture-batch',at:Math.floor(Date.now()/1000)}));if(command==='clients_initialise'){if(library.studio.some(e=>e.kind==='client'))return false;for(const [id,name,pid] of [['client:aanzpa','AANZPA',7],['client:hoea-to-waka','Hoea tō Waka',8]])if(!library.studio.some(e=>e.id===id))library.studio.push({...blankEntry('client',name),id,projects:[pid],status:'active'});return true;}if(command==='get_library')return structuredClone(library);if(command.startsWith('plugin:event|'))return ++cb;if(command==='storage_usage')return{bytes:100,data_bytes:0,library_bytes:100,app_bytes:0};if(['save_library_preferences','diagnostics_record','discard_capture'].includes(command))return;if(command==='read_clipboard')return{files:[],url:'https://example.com/proposal'};

if(command==='update'){const c=args.change;if(c.action==='undo_organisation'){redo.push(structuredClone(library));library=history.pop();return;}if(c.action==='redo_organisation'){history.push(structuredClone(library));library=redo.pop();return;}if(fail){fail=false;throw Error('Simulated save failure');}history.push(structuredClone(library));library.undo_label='Edit studio record';if(c.action==='setup_clients'){for(const [id,name,pid] of [['client:aanzpa','AANZPA',7],['client:hoea-to-waka','Hoea tō Waka',8]])if(!library.studio.some(e=>e.id===id))library.studio.push({...blankEntry('client',name),id,projects:[pid],status:'active'});return;}if(c.action==='update_studio'){const v=JSON.parse(c.value);let e=library.studio.find(e=>e.id===v.id);if(!e){e={...blankEntry(v.patch.kind,v.patch.name),id:v.id};library.studio.push(e);}Object.assign(e,v.patch);e.updated=Date.now();}if(['convert_studio_lead','win_studio_lead'].includes(c.action)){const e=library.studio.find(e=>e.id===c.value);e.status='won';library.projects.push({id:7,name:e.name,count:0});e.projects.push(7);e.handover_project=7;e.actions=e.actions.filter(a=>a.done);}return;}
return null;}};
localStorage.clear();localStorage.setItem('onboarding',JSON.stringify({enabled:false,leadsSeen:true}));let root=createRoot(document.getElementById('root'));root.render(React.createElement(App));

async function field(label,value){const el=document.querySelector(`[aria-label="${label}"]`);el.focus();fill(el,value);await pause(30);el.blur();await pause(120);}
try{
await until(()=>document.querySelector('.section-leads .nav-item'),'Sidebar');document.querySelector('[aria-label="Leads"]').click();[...document.querySelectorAll('.section-leads .nav-item')].find(b=>b.textContent==='Contacts').click();await until(()=>button('Add contact'),'Contacts');const launch=button('Add contact');assert(!launch.disabled&&launch.closest('.studio-toolbar'),'Enabled button beside search');assert(!button('Add organisation')&&!document.querySelector('[aria-label="New record name"]'),'Old quick add removed');
assert(!document.querySelector('[aria-label="Filter by tag"]')&&!button('Archived')&&!launch.closest('.studio-toolbar').querySelector('select'),'Contacts filters removed');assert(getComputedStyle(launch).color==='rgb(255, 255, 255)','Add contact text white');launch.click();await until(()=>document.querySelector('dialog[open]'),'Dialog');const inputs=[...document.querySelectorAll('.add-contact-dialog input')],form=document.querySelector('.add-contact-dialog form');assert(inputs.length===5,'Five fields');assert(inputs[0].required&&inputs[2].required&&inputs[3].required&&!inputs[1].required&&!inputs[4].required,'Required fields');assert(document.activeElement===inputs[0],'First name focused');button('Save contact').click();await pause(60);assert(!library.studio.some(e=>e.kind==='contact'),'No blank contact');
fill(inputs[0],'Jamie');fill(inputs[1],'Wilson');fill(inputs[2],'Example Studio');fill(inputs[3],'bad-email');fill(inputs[4],'021 555 010');await pause(40);assert(!form.checkValidity(),'Invalid email rejected');fill(inputs[3],'jamie@example.com');await pause(40);button('Save contact').click();await until(()=>library.studio.some(e=>e.kind==='contact'),'Saved');const contact=library.studio.find(e=>e.kind==='contact'),org=library.studio.find(e=>e.kind==='organization');assert(contact.name==='Jamie Wilson'&&contact.email==='jamie@example.com'&&contact.phone==='021 555 010'&&contact.organization===org.id,'Complete contact saved');await until(()=>!document.querySelector('dialog'),'Dialog closed');
document.querySelector('.section-leads .nav-item:last-child').click();await until(()=>button('Add contact'),'Back to list');button('Add contact').click();await until(()=>document.querySelector('dialog[open]'),'Second dialog');const again=[...document.querySelectorAll('.add-contact-dialog input')];fill(again[0],'Alex');fill(again[2],'example studio');fill(again[3],'alex@example.com');await pause(40);fail=true;button('Save contact').click();await until(()=>document.querySelector('.add-contact-dialog [role="alert"]'),'Failure shown');assert(again[0].value==='Alex','Failure retains fields');button('Save contact').click();await until(()=>library.studio.filter(e=>e.kind==='contact').length===2,'Retry saved');assert(library.studio.filter(e=>e.kind==='organization').length===1,'Organisation reused');assert(library.studio.find(e=>e.name==='Alex').phone==='','Optional details blank');
document.querySelector('.section-leads .nav-item:last-child').click();await until(()=>button('Add contact'),'List');button('Add contact').click();await until(()=>document.querySelector('dialog[open]'),'Final dialog');window.__screenshotReady=true;await pause(600);button('Cancel').click();await until(()=>!document.querySelector('dialog'),'Cancel');await pause(40);assert(document.activeElement===button('Add contact'),'Focus restored');
document.getElementById('check-result').textContent=JSON.stringify({ok:true,checks:['toolbar layout','enabled launch','required fields','email validation','save contact','reuse organisation','failure and retry','cancel and focus']});
}catch(e){document.getElementById('check-result').textContent=JSON.stringify({ok:false,error:String(e)});}
</script></body></html>
