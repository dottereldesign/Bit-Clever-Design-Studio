<!doctype html><html><head><meta charset="UTF-8"><title>Colour picker checks</title></head><body><div id="root"></div><pre id="check-result" hidden>pending</pre><script type="module">
import React from 'react';import {createRoot} from 'react-dom/client';import ColourPicker,{ProjectColours} from '/src/ColourPicker.tsx';import {appHistory} from '/src/appHistory';import {collectBackupPreferences} from '/src/backupPreferences';import '/src/style.css';
let colour='#abc123',cancel=false,failCopy=false;const copies=[];
window.EyeDropper=class{async open(){if(cancel)throw new DOMException('Cancelled','AbortError');return {sRGBHex:colour};}};
window.__TAURI_INTERNALS__={invoke:async(command,args)=>{if(command==='copy_colour'){if(failCopy)throw Error('Busy clipboard');copies.push(args.hex);return;}if(command==='pick_colour')return '#112233';throw Error(command);}};
function Demo(){const [project,setProject]=React.useState(7);return React.createElement(React.Fragment,null,
 React.createElement('header',{className:'topbar'},React.createElement('div',{className:'view-title'},React.createElement('h1',null,'Website')),React.createElement('div',{className:'header-actions'},React.createElement(ColourPicker,{projects:[{id:7,name:'Website',count:0},{id:9,name:'Brand refresh',count:0}]}),React.createElement('button',{className:'subtle-button',id:'contact-sheet'},'Contact sheet'),React.createElement('span',null,'Storage · Add'))),
 React.createElement(ProjectColours,{key:project,project}),React.createElement('button',{id:'switch-project',onClick:()=>setProject(p=>p===7?9:7)},'Switch project'))}
createRoot(document.getElementById('root')).render(React.createElement(Demo));
const pause=ms=>new Promise(r=>setTimeout(r,ms)),assert=(ok,label)=>{if(!ok)throw Error(label);};
async function until(test,label){const start=performance.now();while(!test()){if(performance.now()-start>5000)throw Error(label);await pause(20);}}
const button=()=>document.querySelector('[aria-label="Pick a colour"]');
const history=()=>JSON.parse(localStorage.getItem('colour-history')??'[]');
const menu=()=>button().dispatchEvent(new MouseEvent('contextmenu',{bubbles:true,cancelable:true}));
try{
 await until(button,'Picker renders');const rect=button().getBoundingClientRect(),contact=document.getElementById('contact-sheet').getBoundingClientRect();assert(rect.right<=contact.left,'Picker should sit before Contact sheet');assert(getComputedStyle(button().parentElement).position==='relative','Picker should participate in header layout');assert(!document.querySelector('.project-colours'),'Empty palette takes space');
 button().click();await until(()=>copies.length===1,'Colour copied');assert(copies[0]==='#ABC123','Hex not normalized');assert(history()[0].hex==='#ABC123','History not persisted');
 menu();await until(()=>document.querySelector('[aria-label="Colour history"]'),'History opens');
 const inputs=[...document.querySelectorAll('.colour-projects input')];inputs[0].click();await pause(50);inputs[1].click();await until(()=>history()[0].projects.length===2,'Multiple projects');
 await until(()=>document.querySelector('.project-colour'),'Assigned colour appears immediately');document.querySelector('.project-colour').click();await until(()=>copies.length===2,'Project swatch copies');assert(copies[1]==='#ABC123','Project swatch copied wrong hex');await until(()=>document.querySelector('.project-colour-status').textContent.includes('copied'),'Missing copy feedback');
 assert(collectBackupPreferences()['colour-history'][0].projects.includes('project:7'),'Assignments missing from backup');
 await appHistory.undo();await until(()=>history()[0].projects.length===1,'Undo assignment');document.getElementById('switch-project').click();await until(()=>!document.querySelector('.project-colours'),'Unassigned project should have no palette');await appHistory.redo();await until(()=>history()[0].projects.length===2,'Redo assignment');await until(()=>document.querySelector('.project-colour'),'Redo updates project palette');document.getElementById('switch-project').click();await pause(50);
 window.__screenshotReady=true;await pause(700);
 document.querySelector('[aria-label="Close colour history"]').click();await pause(40);button().click();await until(()=>copies.length===3,'Pick duplicate');assert(history().length===1&&history()[0].projects.length===2,'Duplicate lost assignments');
 colour='#112244';failCopy=true;button().click();await until(()=>history().length===2,'Save despite clipboard error');await until(()=>document.querySelector('[role=status]')?.textContent.includes('Clipboard unavailable'),'Clipboard failure explained');
 document.querySelector('.project-colour').click();await until(()=>document.querySelector('.project-colour-status').textContent.includes('Clipboard unavailable'),'Project copy failure feedback');assert(document.querySelector('.project-colour code').textContent==='#ABC123','Copy failure removed saved colour');failCopy=false;cancel=true;await until(()=>!button().disabled,'Picker finished');button().click();await pause(100);assert(history().length===2,'Cancel saved a colour');cancel=false;
 delete window.EyeDropper;button().click();await until(()=>history()[0].hex==='#112233','Native fallback');
 menu();await until(()=>document.querySelector('[aria-label="Colour history"]'),'Reopen history');const select=document.querySelector('select');select.value='project:7';select.dispatchEvent(new Event('change',{bubbles:true}));await pause(100);assert(document.querySelectorAll('.colour-swatches button').length===1,'Project filter failed');
 assert(document.querySelector('.colour-value code').textContent==='#ABC123','Selected colour not in filtered project');
 document.querySelector('.colour-panel').dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true}));await until(()=>!document.querySelector('.colour-panel'),'Escape closes');assert(document.activeElement===button(),'Focus not restored');
 document.getElementById('check-result').textContent=JSON.stringify({ok:true,checks:['Inline header picker; live project palette; project isolation; click-to-copy feedback and failures; normalized hex copied; persisted history; multiple project assignments; backup preferences; undo/redo; duplicate preservation; clipboard failure; cancellation; native fallback; project filter; keyboard dismissal']});
}catch(error){document.getElementById('check-result').textContent=JSON.stringify({ok:false,error:String(error)});}
</script></body></html>
