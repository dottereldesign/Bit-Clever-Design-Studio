<!doctype html><html><head><meta charset="UTF-8"></head><body><div id="root"></div><pre id="check-result" hidden>pending</pre><script type="module">
import React from 'react';import{createRoot}from'react-dom/client';import App from '/src/App.tsx';import '/src/style.css';import {emptyBusiness} from '/src/businessData.ts';let business={revision:0,data:emptyBusiness()},failSave=false;
const calls=[];let id=0;window.isTauri=true;window.__TAURI_INTERNALS__={transformCallback:()=>++id,invoke:async(command,args)=>{calls.push(command);if(command==='business_load')return structuredClone(business);if(command==='business_save'){if(failSave)throw Error('Simulated save failure');business={revision:business.revision+1,data:structuredClone(args.data)};return business;}if(command==='open_external_url')return;if(command==='rescan'||command==='apply_app_branding')return;if(command==='clients_initialise')return false;if(command==='calendar_initialise')return {connected:false,meetings:[]};if(command==='get_library')return {items:[],projects:[{id:1,name:'Example project',count:0}],project_folders:[],tags:[],categories:[],sources:[],root:'C:/mock',scanning:false};if(command.startsWith('plugin:event|'))return ++id;if(command==='diagnostics_record'||command==='save_library_preferences')return;if(command==='storage_usage')return {bytes:0,data_bytes:0,app_bytes:0,library_bytes:0};if(command==='diagnostics_read')return {events:[],bytes:0,total:0,dropped:0,failed_writes:0,version:'test',mode:'development'};if(command==='app_version')return 'test';throw Error(command);}};window.__TAURI_EVENT_PLUGIN_INTERNALS__={unregisterListener(){}};
createRoot(document.getElementById('root')).render(React.createElement(App,{startOnHome:false}));const pause=ms=>new Promise(r=>setTimeout(r,ms));async function until(f){for(let i=0;i<300;i++){if(f())return;await pause(20);}throw Error('Timeout');}function assert(f,m){if(!f)throw Error(m);}

const choose=async page=>{document.querySelector(`.business-tabs button[aria-current]`);[...document.querySelectorAll('.business-tabs button')].find(b=>b.textContent===page).click();await pause(60);};
const fill=(label,value)=>{const n=document.querySelector(`[aria-label="${label}"]`);assert(n,'Missing field '+label);Object.getOwnPropertyDescriptor(n.tagName==='SELECT'?HTMLSelectElement.prototype:HTMLInputElement.prototype,'value').set.call(n,value);n.dispatchEvent(new Event(n.tagName==='SELECT'?'change':'input',{bubbles:true}));};
const click=text=>{const n=[...document.querySelectorAll('.business-page button')].find(b=>b.textContent.trim()===text);assert(n,'Missing button '+text);n.click();};
const shot=async name=>{window.__captureName=name;window.__screenshotReady=true;await pause(650);};
try{
 await until(()=>document.querySelector('[aria-label="My Business"]'));assert(document.querySelector('[aria-label="My Business"]').getAttribute('aria-expanded')==='false','Collapsed by default');document.querySelector('[aria-label="My Business"]').click();await pause(50);assert(document.querySelectorAll('#business-sidebar button').length===8,'Eight sidebar pages');document.querySelector('#business-sidebar button').click();await until(()=>document.querySelector('.business-tabs'));assert(document.querySelectorAll('.business-tabs button').length===8,'Eight workspace pages');assert(!document.querySelector('.business-page').textContent.includes('Customise'),'No duplicate customise action');await shot('overview');
 await choose('Business details');fill('Business name','Example business');fill('Planned upfront budget','1000');click('Save business details');await until(()=>business.data.profile.name==='Example business');await choose('Subscriptions');click('Add subscription');await until(()=>document.querySelector('dialog[open]'));fill('Name','Example annual licence');fill('Cost (leave blank until known)','120');fill('Billing frequency','yearly');fill('Status','active');click('Save item');await until(()=>!document.querySelector('dialog[open]'));assert(business.data.records.length===1,'Record persisted');await choose('Budget');assert(document.querySelector('.business-metrics').textContent.includes('10.00'),'Annual subscription monthly equivalent');assert(document.querySelectorAll('.business-record').length===1,'Subscription counted once in Budget');
 click('Add cost');await pause(70);fill('Name','Example equipment');fill('Cost (leave blank until known)','300');click('Save item');await until(()=>!document.querySelector('dialog[open]'));await shot('budget');assert(business.data.records.length===2,'Second cost saved');
 await choose('Domains');click('Add domain');await pause(60);fill('Name','example.invalid');fill('Next payment / renewal','2027-01-01');failSave=true;click('Save item');await until(()=>document.querySelector('dialog [role=alert]'));assert(document.querySelector('[aria-label="Name"]').value==='example.invalid','Failure retains draft');failSave=false;click('Save item');await until(()=>!document.querySelector('dialog[open]'));assert(business.data.records.length===3,'Retry saved');click('Edit');await pause(70);assert(document.activeElement.closest('dialog'),'Editor takes focus');fill('Provider / registrar','Example registrar');click('Save item');await until(()=>!document.querySelector('dialog[open]'));assert(business.data.records.find(r=>r.kind==='domain').provider==='Example registrar','Editing saved');
 await choose('Setup checklist');click('Add starter checklist');await until(()=>business.data.records.some(r=>r.kind==='setup'));const count=business.data.records.length;assert([...document.querySelectorAll('button')].find(b=>b.textContent==='Add starter checklist').disabled,'Checklist not duplicated');await shot('checklist');await choose('Taxes & records');assert(document.querySelector('.business-guidance a[href="https://www.ird.govt.nz/records"]'),'Official guidance');document.querySelector('.business-guidance a').click();await pause(40);assert(calls.includes('open_external_url'),'Reference opens external browser');await choose('Overview');assert(document.querySelector('.business-date').textContent.includes('example.invalid'),'Domain renewal in overview');
 await choose('Domains');click('Remove');await pause(60);assert(business.data.records.length===count,'Removal needs confirmation');click('Confirm remove');await until(()=>business.data.records.length===count-1);document.querySelector('[aria-label="Go to Home"]').click();await until(()=>!document.querySelector('.business-page'));document.querySelector('#business-sidebar button').click();await until(()=>document.querySelector('.business-page h1'));assert(document.querySelector('.business-header').textContent.includes('Example business'),'Saved data reloaded');assert(!localStorage.getItem('private-business-workspace-v1'),'Native data not copied into appearance localStorage');
 document.getElementById('check-result').textContent=JSON.stringify({ok:true,checks:['Sidebar and eight pages','Business details and persistent CRUD','Annual cost calculation and shared budget','Private native storage routing','Save failure retains draft','Checklist idempotence','Renewal overview and confirmed removal','Official reference links']});
}catch(e){document.getElementById('check-result').textContent=JSON.stringify({ok:false,error:String(e),stack:e.stack});}
</script></body></html>
