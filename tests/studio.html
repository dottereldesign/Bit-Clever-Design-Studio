<!doctype html><html><head><meta charset="UTF-8"></head><body><div id="root"></div><pre id="check-result" hidden>pending</pre><script type="module">
import React from 'react';import{createRoot}from'react-dom/client';import App from '/src/App.tsx';import{blankEntry}from'/src/studio.ts';import '/src/style.css';
let library={items:[],studio:[],projects:[],tags:[],categories:[],sources:[],root:'C:/mock',scanning:false};let cb=0;let fail=false;const history=[],redo=[],calls=[];
window.isTauri=true;window.__TAURI_INTERNALS__={transformCallback:()=>++cb,convertFileSrc:x=>x,invoke:async(command,args)=>{calls.push({command,args});if(command==='get_library')return structuredClone(library);if(command.startsWith('plugin:event|'))return ++cb;if(command==='storage_usage')return{bytes:100,data_bytes:0,library_bytes:100,app_bytes:0};if(['save_library_preferences','diagnostics_record','discard_capture'].includes(command))return;if(command==='read_clipboard')return{files:[],url:'https://example.com/proposal'};
if(command==='capture_items_progress'){history.push(structuredClone(library));const id=library.items.length+1;library.items.push({id,path:args.input.url,name:'Proposal reference',kind:'link',source:'',project_only:true,projects:[],tags:[],modified:1,added:1,missing:false});library.studio.find(e=>e.id===args.input.studio).files.push(id);return{ids:[id],added:1,reused:0};}
if(command==='update'){const c=args.change;if(c.action==='undo_organisation'){redo.push(structuredClone(library));library=history.pop();return;}if(c.action==='redo_organisation'){history.push(structuredClone(library));library=redo.pop();return;}if(fail){fail=false;throw Error('Simulated save failure');}history.push(structuredClone(library));library.undo_label='Edit studio record';if(c.action==='update_studio'){const v=JSON.parse(c.value);let e=library.studio.find(e=>e.id===v.id);if(!e){e={...blankEntry(v.patch.kind,v.patch.name),id:v.id};library.studio.push(e);}Object.assign(e,v.patch);e.updated=Date.now();}if(c.action==='convert_studio_lead'){const e=library.studio.find(e=>e.id===c.value);library.projects.push({id:7,name:e.name,count:0});e.projects.push(7);}return;}
return null;}};
localStorage.clear();let root=createRoot(document.getElementById('root'));root.render(React.createElement(App));
const pause=ms=>new Promise(r=>setTimeout(r,ms));const assert=(value,message)=>{if(!value)throw Error(message);};async function until(fn,label){for(let i=0;i<160;i++){if(fn())return;await pause(30);}throw Error('Timed out: '+label);}
const button=(text,scope=document)=>[...scope.querySelectorAll('button')].find(b=>b.textContent.trim()===text);const fill=(el,value)=>{assert(el,'Missing field');const proto=el.tagName==='TEXTAREA'?HTMLTextAreaElement.prototype:el.tagName==='SELECT'?HTMLSelectElement.prototype:HTMLInputElement.prototype;Object.getOwnPropertyDescriptor(proto,'value').set.call(el,value);el.dispatchEvent(new Event(el.tagName==='SELECT'?'change':'input',{bubbles:true}));};
async function field(label,value){const el=document.querySelector(`[aria-label="${label}"]`);el.focus();fill(el,value);await pause(30);el.blur();await pause(120);}
try{
await until(()=>document.querySelector('[aria-label="Leads"]'),'Sidebar');assert([...document.querySelectorAll('.sidebar-scroll>[data-section]')].slice(0,3).map(e=>e.dataset.section).join(',')==='Marketing,Leads,General','Sidebar order');document.querySelector('[aria-label="Leads"]').click();await until(()=>document.querySelector('[aria-label="New record name"]'),'Leads');
fill(document.querySelector('[aria-label="New record name"]'),'Brand refresh');await pause(50);button('Add lead').click();await until(()=>document.querySelector('[aria-label="Stage"]'),'Lead details');const lead=library.studio.find(e=>e.kind==='lead');await field('Brief','Identity and website');assert(lead.body==='Identity and website','Brief saved');
fill(document.querySelector('[aria-label="New next action"]'),'Send proposal');await pause(50);document.querySelector('.studio-actions form').dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));await until(()=>lead.actions.length===1,'Next action');fill(document.querySelector('[aria-label="Deadline for Send proposal"]'),'2026-01-01');await pause(100);assert(document.querySelector('.studio-overdue'),'Overdue marker');
button('Files',document.querySelector('.studio-tabs')).click();await pause(100);button('Paste here').click();await until(()=>lead.files.length===1,'Paste into lead');assert(library.items[0].project_only,'Private import');assert(calls.some(c=>c.command==='capture_items_progress'&&c.args.input.studio===lead.id),'Captured destination');
button('Overview',document.querySelector('.studio-tabs')).click();await pause(100);fill(document.querySelector('[aria-label="Stage"]'),'won');await until(()=>button('Create project'),'Won handover');button('Create project').click();await until(()=>lead.projects.length===1,'Project linked');assert(library.projects[0].name==='Brand refresh','Project name');
document.querySelector('[aria-label="Marketing"]').click();await pause(150);fill(document.querySelector('[aria-label="New record name"]'),'Studio launch');await pause(60);button('Add campaign').click();await until(()=>document.querySelector('[aria-label="Audience"]'),'Campaign plan');const campaign=library.studio.find(e=>e.kind==='campaign');await field('Audience','Local businesses');await field('Objective and strategy','Introduce the studio and invite enquiries');
button('Content',document.querySelector('.studio-tabs')).click();await pause(100);fill(document.querySelector('[aria-label="New content"]'),'Launch post');await pause(40);document.querySelector('.studio-content form').dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));await until(()=>document.querySelector('[aria-label="Planned date"]'),'Content editor');await field('Planned date','2026-11-20');const content=library.studio.find(e=>e.kind==='content');assert(content.parent===campaign.id&&content.date==='2026-11-20','Schedule association');
document.querySelector('[aria-label="Back to list"]').click();await pause(120);button('Schedule',document.querySelector('.studio-tabs')).click();await pause(100);fill(document.querySelector('[aria-label="Calendar month"]'),'2026-11');await pause(100);assert(button('Launch post',document.querySelector('.studio-calendar')),'Scheduled content visible');
button('Moodboard',document.querySelector('.studio-tabs')).click();await pause(120);button('Note',document.querySelector('.project-moodboard')).click();await until(()=>campaign.moodboard.length===1,'Campaign moodboard');
button('Plan',document.querySelector('.studio-tabs')).click();await pause(100);fail=true;await field('Audience','New audience');await until(()=>document.querySelector('.studio-field [role="alert"]'),'Failed save visible');assert(campaign.audience==='Local businesses','Failed save did not change data');button('Retry',document.querySelector('.studio-field [role="alert"]')).click();await until(()=>campaign.audience==='New audience','Retry saved');
window.__screenshotReady=true;window.__captureName='campaign';await pause(700);
document.querySelector('[aria-label="Back to list"]').click();await pause(120);button('Board').click();await pause(120);assert(document.querySelectorAll('.studio-board>section').length===6,'Campaign board stages');window.__captureName='board';await pause(700);
document.querySelector('[aria-label="Leads"]').click();await pause(100);button('Follow-ups',document.querySelector('.studio-tabs')).click();await pause(100);assert(button('Brand refresh'),'Follow-up listed');button('Contacts',document.querySelector('.studio-tabs')).click();await pause(100);fill(document.querySelector('[aria-label="New record name"]'),'Alex Client');await pause(40);button('Add contact').click();await until(()=>document.querySelector('[aria-label="Email"]'),'Shared contact');await field('Email','alex@example.com');
await pause(200);root.unmount();root=createRoot(document.getElementById('root'));root.render(React.createElement(App));await until(()=>document.querySelector('[aria-label="Email"]'),'Restored studio route');assert(document.querySelector('[aria-label="Email"]').value==='alex@example.com','Contact restored');
document.getElementById('check-result').textContent=JSON.stringify({ok:true,checks:['Sidebar order; lead edits/actions; scoped imports; won handover; campaign content/calendar/moodboard; failed-save retry; board; follow-ups; contacts; session restore']});
}catch(error){document.getElementById('check-result').textContent=JSON.stringify({ok:false,error:String(error)});}
</script></body></html>
