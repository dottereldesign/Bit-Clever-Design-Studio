<!doctype html><html><head><meta charset="UTF-8"></head><body><div id="root"></div><pre id="check-result" hidden>pending</pre><script type="module">
import React from 'react';import {flushSync} from 'react-dom';import{createRoot}from'react-dom/client';import App from '/src/App.tsx';import{blankEntry}from'/src/studio.ts';import '/src/style.css';
let library={items:Array.from({length:4000},(_,i)=>({id:i+1,path:`C:/fixture/${i}.png`,name:`Reference ${i}`,kind:"image",source:"Design/branding",projects:[],tags:[],added:1,modified:1,missing:false})),studio:[{...blankEntry("client","Example client"),id:"client:fixture",projects:[],status:"active"}],projects:[{id:7,name:'AANZPA',count:0},{id:8,name:'Hoea tō Waka',count:0}],tags:[],categories:[],sources:[],root:'C:/mock',scanning:false};let cb=0;let fail=false;const history=[],redo=[],calls=[],diagnostics=[];
window.isTauri=true;window.__TAURI_INTERNALS__={transformCallback:()=>++cb,convertFileSrc:x=>x,invoke:async(command,args)=>{calls.push({command,args});if(command==='diagnostics_record'){diagnostics.push(...args.events);return;}if(command==='client_feed')return Array.from({length:100},(_,i)=>({id:i+1,key:`event-${i}`,clients:['client:fixture'],entity:'studio',record:'client:fixture',project:null,title:'Changed record',before:{body:'Earlier notes '.repeat(100)},after:{body:'Updated notes '.repeat(100)},action:'update_studio',batch:'batch',at:Math.floor(Date.now()/1000)}));if(command==='clients_initialise'){if(library.studio.some(e=>e.kind==='client'))return false;for(const [id,name,pid] of [['client:aanzpa','AANZPA',7],['client:hoea-to-waka','Hoea tō Waka',8]])if(!library.studio.some(e=>e.id===id))library.studio.push({...blankEntry('client',name),id,projects:[pid],status:'active'});return true;}if(command==='get_library')return structuredClone(library);if(command.startsWith('plugin:event|'))return ++cb;if(command==='storage_usage')return{bytes:100,data_bytes:0,library_bytes:100,app_bytes:0};if(['save_library_preferences','diagnostics_record','discard_capture'].includes(command))return;if(command==='read_clipboard')return{files:[],url:'https://example.com/proposal'};
if(command==='capture_items_progress'){history.push(structuredClone(library));const id=library.items.length+1;library.items.push({id,path:args.input.url,name:'Proposal reference',kind:'link',source:'',project_only:true,projects:[{id:7,name:'AANZPA',count:0},{id:8,name:'Hoea tō Waka',count:0}],tags:[],modified:1,added:1,missing:false});library.studio.find(e=>e.id===args.input.studio).files.push(id);return{ids:[id],added:1,reused:0};}
if(command==='update'){const c=args.change;if(c.action==='undo_organisation'){redo.push(structuredClone(library));library=history.pop();return;}if(c.action==='redo_organisation'){history.push(structuredClone(library));library=redo.pop();return;}if(fail){fail=false;throw Error('Simulated save failure');}history.push(structuredClone(library));library.undo_label='Edit studio record';if(c.action==='setup_clients'){for(const [id,name,pid] of [['client:aanzpa','AANZPA',7],['client:hoea-to-waka','Hoea tō Waka',8]])if(!library.studio.some(e=>e.id===id))library.studio.push({...blankEntry('client',name),id,projects:[pid],status:'active'});return;}if(c.action==='update_studio'){const v=JSON.parse(c.value);let e=library.studio.find(e=>e.id===v.id);if(!e){e={...blankEntry(v.patch.kind,v.patch.name),id:v.id};library.studio.push(e);}Object.assign(e,v.patch);e.updated=Date.now();}if(['convert_studio_lead','win_studio_lead'].includes(c.action)){const e=library.studio.find(e=>e.id===c.value);e.status='won';library.projects.push({id:7,name:e.name,count:0});e.projects.push(7);e.handover_project=7;e.actions=e.actions.filter(a=>a.done);}return;}
return null;}};
localStorage.clear();localStorage.setItem('onboarding',JSON.stringify({enabled:false,leadsSeen:true}));let root=createRoot(document.getElementById('root'));root.render(React.createElement(App));
const pause=ms=>new Promise(r=>setTimeout(r,ms));const assert=(value,message)=>{if(!value)throw Error(message);};async function until(fn,label){for(let i=0;i<160;i++){if(fn())return;await pause(30);}throw Error('Timed out: '+label);}
const button=(text,scope=document)=>[...scope.querySelectorAll('button')].find(b=>b.textContent.trim()===text);const fill=(el,value)=>{assert(el,'Missing field');const proto=el.tagName==='TEXTAREA'?HTMLTextAreaElement.prototype:el.tagName==='SELECT'?HTMLSelectElement.prototype:HTMLInputElement.prototype;Object.getOwnPropertyDescriptor(proto,'value').set.call(el,value);el.dispatchEvent(new Event(el.tagName==='SELECT'?'change':'input',{bubbles:true}));};
async function field(label,value){const el=document.querySelector(`[aria-label="${label}"]`);el.focus();fill(el,value);await pause(30);el.blur();await pause(120);}
try{
 await until(()=>document.querySelector('[aria-label="Clients"]'),'Startup');
 const frames=()=>new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
 const timings=[];
 for(let i=0;i<8;i++){
  if(document.querySelector('[aria-label="Leads"]').getAttribute('aria-expanded')!=='true')document.querySelector('[aria-label="Leads"]').click();document.querySelector('.section-leads .nav-item').click();await until(()=>document.querySelector('.studio-workspace'),'Leads');await frames();
  const start=performance.now();if(document.querySelector('[aria-label="Clients"]').getAttribute('aria-expanded')!=='true')document.querySelector('[aria-label="Clients"]').click();document.querySelector('.section-clients .nav-item').click();await until(()=>document.querySelector('.clients-workspace'),'Clients');await frames();timings.push(Math.round(performance.now()-start));
 }
 await until(()=>document.querySelector('.client-activity-row'),'Feed');
 const reads=calls.filter(c=>c.command==='get_library').length,setup=calls.filter(c=>c.command==='clients_initialise').length,oldSetup=calls.filter(c=>c.command==='update'&&c.args.change.action==='setup_clients').length,feeds=calls.filter(c=>c.command==='client_feed').length;
 if(!new URLSearchParams(location.search).has('baseline')){
 assert(reads===1,'Reopening Clients must not reload library: '+reads);assert(setup===1,'Initialise once per library: '+setup);assert(oldSetup===0,'Do not mutate on each open');assert(feeds===1,'Reuse unchanged activity: '+feeds);assert(document.querySelectorAll('.clients-change').length===0,'Do not render technical diffs');
 assert(document.querySelectorAll('.client-activity-row').length===100,'Compact activity rows');
 for(const name of ['Leads','Clients','Leads','Clients'])flushSync(()=>document.querySelector(`.section-${name.toLowerCase()} .nav-item`).click());await frames();await frames();
 const {flushDiagnostics}=await import('/src/diagnostics.ts');await flushDiagnostics();
 const navigation=diagnostics.filter(e=>e.name==='navigation');assert(navigation.some(e=>e.status==='cancelled'),'Interrupted navigation logged as cancelled');assert(navigation.filter(e=>e.status==='started').every(start=>navigation.some(end=>end.operation===start.operation&&['cancelled','success'].includes(end.status))),'No orphaned navigation measurements');
 button('Refresh',document.querySelector('.clients-workspace')).click();await until(()=>calls.filter(c=>c.command==='client_feed').length===2,'Explicit refresh bypasses cache');
 }
 document.getElementById('check-result').textContent=JSON.stringify({ok:true,items:library.items.length,timings,libraryReads:reads,setupCalls:setup,oldSetupCalls:oldSetup,feedReads:feeds});
}catch(error){document.getElementById('check-result').textContent=JSON.stringify({ok:false,error:String(error)});}
</script></body></html>
