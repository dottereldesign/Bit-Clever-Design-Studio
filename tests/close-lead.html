<!doctype html><html><head><meta charset="UTF-8"><title>Lead handover checks</title></head><body><div id="root"></div><pre id="check-result" hidden>pending</pre><script type="module">
import React from 'react';import {createRoot} from 'react-dom/client';import CloseLeadDialog from '/src/CloseLeadDialog.tsx';import {blankEntry} from '/src/studio.ts';import '/src/style.css';
const root=createRoot(document.getElementById('root')),lead={...blankEntry('lead','Website refresh'),id:'lead',updated:42,value:6500,currency:'NZD',email:'alex@example.com'},lib={items:[],projects:[],tags:[],sources:[],studio:[lead]};
let saved=[],closed=0,opened=[],fail=true;
const pause=ms=>new Promise(r=>setTimeout(r,ms)),assert=(ok,label)=>{if(!ok)throw Error(label);};
const render=async(outcome='won')=>{root.render(React.createElement(CloseLeadDialog,{key:crypto.randomUUID(),lead,lib,initialOutcome:outcome,close:()=>{closed++;root.render(null);},openProject:id=>opened.push(id),mutate:async c=>{saved.push(JSON.parse(c.value));if(fail){fail=false;throw Error('Please retry');}return {...lib,studio:[{...lead,handover_project:7}]};}}));await pause(100);};
const input=async(label,value)=>{const n=document.querySelector(`[aria-label="${label}"]`);assert(n,'Input '+label);Object.getOwnPropertyDescriptor(n.tagName==='TEXTAREA'?HTMLTextAreaElement.prototype:HTMLInputElement.prototype,'value').set.call(n,value);n.dispatchEvent(new Event('input',{bubbles:true}));await pause(30);};
const next=async()=>{document.querySelector('form').requestSubmit();await pause(60);};
const shot=async name=>{window.__captureName=name;window.__screenshotReady=true;await pause(550);};
try{
 await render();assert(document.querySelector('dialog').open,'Modal');await next();assert(document.querySelector('[aria-label="Contact 1 name"]'),'People step');await next();assert(!saved.length&&document.querySelector('[aria-label="Contact 1 name"]'),'Validation before save');await input('Contact 1 name','Alex Taylor');document.querySelector('input[required][type=checkbox]').click();await pause(30);await shot('people');await next();await input('Handover project deadline','2027-02-15');document.querySelector('.close-lead-check input').click();await pause(30);await input('First meeting date','2027-01-10');await input('First meeting time','09:30');await shot('project');assert(saved.length===0,'No early save');await next();assert(document.querySelector('[role=alert]').textContent.includes('Please retry')&&closed===0,'Failure retains review');await next();assert(closed===1&&opened[0]===7,'Success opens project');const c=saved[1];assert(c.outcome==='won'&&c.contacts[0].name==='Alex Taylor'&&c.contacts[0].email==='alex@example.com'&&c.deadline==='2027-02-15'&&c.meeting.time==='09:30'&&c.value===6500,'Complete payload');
 await render('lost');await next();await input('Lead close note','Timing changed');await next();await next();assert(saved.at(-1).outcome==='lost'&&saved.at(-1).reason==='Timing changed'&&opened.length===1,'Lost preserves history without opening project');await render();await next();document.querySelector('[aria-label="Cancel lead handover"]').click();await pause(50);assert(saved.length===3&&!document.querySelector('dialog'),'Cancellation does not save');
 document.getElementById('check-result').textContent=JSON.stringify({ok:true,checks:['Three steps, contact confirmation, deadline and first meeting; no early writes; retry; Won opens project; Lost and cancellation']});
}catch(error){document.getElementById('check-result').textContent=JSON.stringify({ok:false,error:String(error),stack:error.stack});}
</script></body></html>
