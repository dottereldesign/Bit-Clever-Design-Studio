<!doctype html><html><head><meta charset="UTF-8"></head><body><div id="root"></div><pre id="check-result" hidden>pending</pre><script type="module">
import React from 'react';import {createRoot} from 'react-dom/client';import App from '/src/App.tsx';import '/src/style.css';
const lib={items:Array.from({length:600},(_,n)=>({id:n+1,name:'Reference '+n,path:'https://example.org/'+n,kind:'link',source:'Links',projects:[7],project_folders:n<20?[10]:[],tags:[],modified:1,added:n,missing:false})),projects:[{id:7,name:'Test project',count:600}],project_folders:[{id:10,project_id:7,parent_id:null,name:'Research',position:null}],tags:[],categories:[],sources:[],root:'C:/mock',scanning:false};
let callback=0;const calls=[];window.addEventListener('error',e=>calls.push(e.message));window.isTauri=true;window.__TAURI_INTERNALS__={transformCallback:()=>++callback,invoke:async (c,args)=>{calls.push(c);if(c==='update'){const change=args.change;if(change.action==='rate_links')lib.items.find(i=>i.id===change.ids[0]).rating=Number(change.value);return;}if(c==='get_library')return lib;if(c.startsWith('plugin:event|'))return ++callback;if(c==='storage_usage')return {bytes:0,data_bytes:0,library_bytes:0,app_bytes:0,partial:false};if(c==='save_library_preferences')return;throw Error(c);}};window.__TAURI_EVENT_PLUGIN_INTERNALS__={unregisterListener(){}};
createRoot(document.getElementById('root')).render(React.createElement(App,{startOnHome:false}));
const pause=ms=>new Promise(r=>setTimeout(r,ms));async function until(f){for(let n=0;n<400;n++){if(f())return;await pause(20);}throw Error('Timeout');}const frame=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
try{await until(()=>document.querySelector('[data-project-id="7"] .nav-item'));document.querySelector('[data-project-id="7"] .nav-item').click();await until(()=>document.querySelector('[data-project-folder-id="10"]'));await pause(300);let timings=[];
for(let n=0;n<3;n++){document.querySelector('[data-project-folder-id="10"]').click();await frame();const t=performance.now();document.querySelector('[data-project-unfiled="7"]').click();await frame();timings.push(Math.round(performance.now()-t));}
const mounted=document.querySelectorAll('.links-table tr[data-item-id]').length;if(mounted>80)throw Error('Offscreen rows were all mounted');if(calls.filter(c=>c==='get_library').length!==1)throw Error('Navigation reloaded the library');document.querySelector('.content').scrollTop=100000;await pause(300);if(!document.querySelector('[data-item-id="21"]'))throw Error('Last unfiled link inaccessible');document.querySelector('[data-item-id="21"] [aria-label="4 stars"]').click();await until(()=>lib.items.find(i=>i.id===21).rating===4);document.querySelector('.content').scrollTop=0;await pause(250);if(!document.querySelector('[data-item-id="600"]'))throw Error('Cannot return to first row');document.querySelector('[data-project-overview="7"]').click();await until(()=>document.querySelector('.project-overview'));if(document.querySelector('[data-project-overview="7"]').getAttribute('aria-current')!=='page')throw Error('Overview not selected');document.getElementById('check-result').textContent=JSON.stringify({ok:true,timings,mounted,checks:['Bounded row rendering','Last row accessible and rating works','Return to first row','No library reload on navigation']});
}catch(e){document.getElementById('check-result').textContent=JSON.stringify({ok:false,error:String(e),calls,body:document.body.innerText.slice(0,500)});}
</script></body></html>
