<!doctype html><html><head><meta charset="UTF-8"></head><body><div id="root" style="padding:24px"></div><pre id="check-result" hidden>pending</pre><script type="module">
import React from 'react';import{createRoot}from'react-dom/client';import CalendarConnection,{useCalendarSync}from'/src/CalendarConnection.tsx';import '/src/style.css';import '/src/studio.css';
const event=(uid,title,extra='')=>`BEGIN:VEVENT\r\nUID:${uid}\r\nSUMMARY:${title}\r\nDTSTART:20261126T220000Z\r\nDTEND:20261126T230000Z\r\n${extra}\r\nEND:VEVENT`;
const text='BEGIN:VCALENDAR\r\nVERSION:2.0\r\n'+[event('aanzpa','AANZPA planning'),event('hoea','Anna Brown review'),event('private','Personal appointment'),event('repeat','Weekly meeting','RRULE:FREQ=WEEKLY')].join('\r\n')+'\r\nEND:VCALENDAR';
let status={connected:false,last_sync:0,meetings:[]},fail=true;const calls=[],logs=[];
window.isTauri=true;window.__TAURI_INTERNALS__={invoke:async(command,args)=>{calls.push(command);if(command==='diagnostics_record'){logs.push(...args.events);return;}if(command==='calendar_initialise')return status;if(command==='calendar_connect'){if(fail){fail=false;throw Error('Windows credential protection is unavailable.');}status={...status,connected:true};return status;}if(command==='calendar_feed')return{text,rules:status.meetings,generation:'test'};if(command==='get_library')return{projects:[{id:1,name:'AANZPA'},{id:2,name:'Hoea tō Waka'}]};if(command==='calendar_select'){status={...status,meetings:args.meetings,last_sync:1794520000};return status;}if(command==='calendar_apply')return status;return null;}};
const refresh=async()=>{};function Test(){useCalendarSync(true,refresh);return React.createElement(CalendarConnection);}createRoot(document.getElementById('root')).render(React.createElement(Test));
const pause=ms=>new Promise(r=>setTimeout(r,ms)),assert=(ok,msg)=>{if(!ok)throw Error(msg);};async function until(fn){for(let i=0;i<200;i++){if(fn())return;await pause(25);}throw Error('Timed out');}
const button=t=>[...document.querySelectorAll('button')].find(b=>b.textContent===t),input=(label,value)=>{const el=document.querySelector(`[aria-label="${label}"]`);Object.getOwnPropertyDescriptor(el.tagName==='SELECT'?HTMLSelectElement.prototype:HTMLInputElement.prototype,'value').set.call(el,value);el.dispatchEvent(new Event(el.tagName==='SELECT'?'change':'input',{bubbles:true}));};
try{
 await until(()=>button('Connect calendar'));input('Private calendar feed','https://calendar.google.com/calendar/ical/example/private-test/basic.ics');await pause(30);button('Connect calendar').click();await until(()=>document.querySelector('[role=alert]'));assert(document.querySelector('[role=alert]').textContent.includes('Windows credential protection'),'Preserve actual failure');assert(document.querySelector('[aria-label="Private calendar feed"]').value,'Keep input for retry');
 button('Connect calendar').click();await until(()=>document.querySelector('[aria-label="Project for AANZPA planning"]'));assert(status.connected&&status.meetings.length===0,'Can connect before selection');assert(!calls.includes('calendar_apply'),'Do not import unselected events');
 assert(document.querySelector('[aria-label="Project for Weekly meeting"]').disabled,'Recurring meeting explained, not silently imported');
 input('Project for AANZPA planning','AANZPA');await pause(30);input('Project for Anna Brown review','Hoea tō Waka');await pause(30);
 window.__screenshotReady=true;await pause(600);button('Sync selected meetings (2)').click();await until(()=>status.meetings.length===2&&!document.querySelector('.calendar-meeting-picker'));
 assert(status.meetings.every(m=>m.uid!=='private'),'Personal event excluded');assert(status.meetings[0].project_name==='AANZPA'&&status.meetings[1].project_name==='Hoea tō Waka','Project assignments');
 button('Choose meetings').click();await until(()=>document.querySelector('[aria-label="Project for Personal appointment"]'));assert(!document.querySelector('[aria-label="Project for AANZPA planning"]'),'Already selected meetings excluded');
 const {flushDiagnostics}=await import('/src/diagnostics.ts');await flushDiagnostics();assert(!JSON.stringify(logs).includes('private-test'),'Secret URL never logged');
 document.getElementById('check-result').textContent=JSON.stringify({ok:true,checks:['Actual error shown; retry keeps input','Empty calendar connects','Explicit meeting/project selection','Unselected personal events excluded','Recurring events labelled','Selected meetings excluded on reopen','No secret URL in diagnostics']});
}catch(error){document.getElementById('check-result').textContent=JSON.stringify({ok:false,error:String(error)});}
</script></body></html>
