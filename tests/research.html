<!doctype html><html><head><meta charset="UTF-8"></head><body><div id="root"></div><pre id="check-result" hidden>pending</pre><script type="module">
import React from 'react';import{createRoot}from'react-dom/client';import App from '/src/App.tsx';import{blankEntry}from'/src/studio.ts';import '/src/style.css';
let library={items:[],studio:[],projects:[],tags:[],categories:[],sources:[],root:'C:/mock',scanning:false};let cb=0;let fail=false;const history=[],redo=[],calls=[];
window.isTauri=true;window.__TAURI_INTERNALS__={transformCallback:()=>++cb,convertFileSrc:x=>x,invoke:async(command,args)=>{calls.push({command,args});if(command==='get_library')return structuredClone(library);if(command.startsWith('plugin:event|'))return ++cb;if(command==='storage_usage')return{bytes:100,data_bytes:0,library_bytes:100,app_bytes:0};if(['save_library_preferences','diagnostics_record','discard_capture'].includes(command))return;if(command==='read_clipboard')return{files:[],url:'https://example.com/proposal'};
if(command==='capture_items_progress'){history.push(structuredClone(library));const id=library.items.length+1;library.items.push({id,path:args.input.url,name:'Proposal reference',kind:'link',source:'',project_only:true,projects:[],tags:[],modified:1,added:1,missing:false});library.studio.find(e=>e.id===args.input.studio).files.push(id);return{ids:[id],added:1,reused:0};}
if(command==='update'){const c=args.change;if(c.action==='undo_organisation'){redo.push(structuredClone(library));library=history.pop();return;}if(c.action==='redo_organisation'){history.push(structuredClone(library));library=redo.pop();return;}if(fail){fail=false;throw Error('Simulated save failure');}history.push(structuredClone(library));library.undo_label='Edit studio record';if(c.action==='update_studio'){const v=JSON.parse(c.value);let e=library.studio.find(e=>e.id===v.id);if(!e){e={...blankEntry(v.patch.kind,v.patch.name),id:v.id};library.studio.push(e);}Object.assign(e,v.patch);e.updated=Date.now();}if(['convert_studio_lead','win_studio_lead'].includes(c.action)){const e=library.studio.find(e=>e.id===c.value);e.status='won';library.projects.push({id:7,name:e.name,count:0});e.projects.push(7);e.handover_project=7;e.actions=e.actions.filter(a=>a.done);}return;}
return null;}};
localStorage.clear();localStorage.setItem('onboarding',JSON.stringify({enabled:false,leadsSeen:true}));let root=createRoot(document.getElementById('root'));root.render(React.createElement(App));
const pause=ms=>new Promise(r=>setTimeout(r,ms));const assert=(value,message)=>{if(!value)throw Error(message);};async function until(fn,label){for(let i=0;i<160;i++){if(fn())return;await pause(30);}throw Error('Timed out: '+label);}
const button=(text,scope=document)=>[...scope.querySelectorAll('button')].find(b=>b.textContent.trim()===text);const fill=(el,value)=>{assert(el,'Missing field');const proto=el.tagName==='TEXTAREA'?HTMLTextAreaElement.prototype:el.tagName==='SELECT'?HTMLSelectElement.prototype:HTMLInputElement.prototype;Object.getOwnPropertyDescriptor(proto,'value').set.call(el,value);el.dispatchEvent(new Event(el.tagName==='SELECT'?'change':'input',{bubbles:true}));};
async function field(label,value){const el=document.querySelector(`[aria-label="${label}"]`);el.focus();fill(el,value);await pause(30);el.blur();await pause(120);}
try{
await until(()=>document.querySelector('[aria-label="Research"]'),'Research section');document.querySelector('[aria-label="Research"]').click();await until(()=>document.querySelector('.research-workspace'),'Research opens');assert(document.querySelector('.sidebar .section-components').nextElementSibling.dataset.section==='Research','Research follows Components');
fill(document.querySelector('[aria-label="Research title"]'),'Competitor pricing');await pause(50);button('Add research').click();await until(()=>document.querySelector('[aria-label="Research type"]'),'Editor');const entry=library.studio.find(e=>e.kind==='research');fill(document.querySelector('[aria-label="Research type"]'),'pricing');await until(()=>document.querySelector('[aria-label="Price"]'),'Pricing fields');await field('Price','49');await field('Currency','NZD');await field('Pricing basis (e.g. per month)','per month');await field('Notes and questions','Compare support and limits');await field('Findings and takeaways','Check annual discounts');await field('Tags','pricing, business');assert(entry.results==='Check annual discounts'&&entry.value===49,'Pricing and notes saved');
button('Paste here',document.querySelector('.research-files')).click();await until(()=>entry.files.length===1,'Queued attachment');assert(library.items[0].project_only,'Research attachment leaked into Designs');
library.projects.push({id:7,name:'Client work',count:0});await field('Author, host or organisation','Competitor');fill(document.querySelector('[aria-label="Link research to project"]'),'7');await until(()=>entry.projects.includes(7),'Project linked');
document.querySelector('[aria-label="Back to research"]').click();await until(()=>document.querySelector('.research-row'),'List');button('Pricing',document.querySelector('.research-tabs')).click();await pause(100);assert(document.querySelector('.research-row').textContent.includes('Competitor pricing'),'Pricing filter');window.__screenshotReady=true;await pause(800);
button('Reading & listening',document.querySelector('.research-tabs')).click();await pause(100);assert(!document.querySelector('.research-row'),'Learning filter');fill(document.querySelector('[aria-label="Research title"]'),'Design podcast');await pause(40);button('Add research').click();await until(()=>document.querySelector('[aria-label="Research type"]'),'Learning editor');fill(document.querySelector('[aria-label="Research type"]'),'podcast');await pause(80);fill(document.querySelector('[aria-label="Research status"]'),'complete');await until(()=>library.studio.find(e=>e.name==='Design podcast').status==='complete','Podcast status');await field('Source URL','https://example.com/podcast');button('Archive',document.querySelector('.research-header')).click();await until(()=>library.studio.find(e=>e.name==='Design podcast').archived,'Archive');document.querySelector('[aria-label="Undo change"]').click();await until(()=>!library.studio.find(e=>e.name==='Design podcast').archived,'Undo archive');
root.unmount();root=createRoot(document.getElementById('root'));root.render(React.createElement(App));await until(()=>document.querySelector('[aria-label="Title"]')?.value==='Design podcast','Research session restored');assert(document.querySelector('[aria-label="Source URL"]').value==='https://example.com/podcast','Saved source restored');
document.getElementById('check-result').textContent=JSON.stringify({ok:true,checks:['Sidebar placement; research create/edit; pricing; notes/tags; private attachment queue; project association; topic filters; podcasts; archive/undo; session restore']});
}catch(error){document.getElementById('check-result').textContent=JSON.stringify({ok:false,error:String(error)});}
</script></body></html>
