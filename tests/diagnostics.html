<!doctype html><html><head><meta charset="UTF-8"></head><body><main style="max-width:1000px;margin:30px auto"><div id="root"></div></main><pre id="check-result" hidden>pending</pre><script type="module">
import React from 'react';import{createRoot}from'react-dom/client';import Diagnostics from '/src/DiagnosticsPanel.tsx';import {invoke,flushDiagnostics} from '/src/diagnostics.ts';import '/src/style.css';
let events=[{time:Date.now(),name:'navigation',operation:'test-1',status:'success',duration:123,fields:{view:'project',items:580}},{time:Date.now(),name:'capture_website',operation:'test-2',status:'error',duration:5000,fields:{error_code:'timeout'}}];window.isTauri=true;window.__TAURI_INTERNALS__={invoke:async(command,args)=>{if(command==='diagnostics_record'){events.push(...args.events.map(e=>({...e,time:Date.now()})));return;}if(command==='diagnostics_read')return {events:[...events].reverse(),total:events.length,bytes:25000,dropped:0,failed_writes:0,version:'test',mode:'development'};if(command==='test_command')return {added:1};throw Error('Unexpected '+command);}};
createRoot(document.getElementById('root')).render(React.createElement(Diagnostics));const pause=ms=>new Promise(r=>setTimeout(r,ms));const button=name=>[...document.querySelectorAll('button')].find(b=>b.textContent.includes(name));async function until(fn){for(let n=0;n<200;n++){if(fn())return;await pause(20);}throw Error('Timeout');}
try{await until(()=>button('Diagnostics'));button('Diagnostics').click();await until(()=>document.querySelectorAll('.diagnostic-events details').length===2);button('Mark a problem').click();await until(()=>events.some(e=>e.name==='user.problem_mark'));button('Performance').click();await until(()=>document.querySelector('tbody tr'));button('Problems').click();await pause(100);if(!document.body.textContent.includes('capture_website'))throw Error('Missing error');button('Usage').click();await pause(100);button('Activity').click();await pause(100);
await invoke('test_command',{url:'https://private.example/secret',input:{files:[{path:'C:/secret.png'}]}});await flushDiagnostics();if(JSON.stringify(events).includes('private.example')||JSON.stringify(events).includes('secret.png'))throw Error('Sensitive args leaked');if(!events.some(e=>e.name==='test_command'&&e.status==='success'))throw Error('Missing command result');window.__screenshotReady=true;await pause(700);document.getElementById('check-result').textContent=JSON.stringify({ok:true,checks:['Activity and all tabs','Problem bookmark','Command outcome','Arguments excluded']});}catch(e){document.getElementById('check-result').textContent=JSON.stringify({ok:false,error:String(e)});}
</script></body></html>
