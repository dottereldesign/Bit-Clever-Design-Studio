<!doctype html><html><head><meta charset="UTF-8"></head><body><div id="root"></div><pre id="check-result" hidden>pending</pre><script type="module">
import React from 'react';import{createRoot}from'react-dom/client';import App from '/src/App.tsx';import{blankEntry}from'/src/studio.ts';import '/src/style.css';
let library={items:[],studio:[],projects:[{id:7,name:'AANZPA',count:0},{id:8,name:'Hoea tō Waka',count:0}],tags:[],categories:[],sources:[],root:'C:/mock',scanning:false};let cb=0;let fail=false;const history=[],redo=[],calls=[];
window.isTauri=true;window.__TAURI_INTERNALS__={transformCallback:()=>++cb,convertFileSrc:x=>x,invoke:async(command,args)=>{calls.push({command,args});if(command==='client_feed')return library.studio.filter(e=>e.kind==='client_entry').map((e,i)=>({id:i+1,key:e.id,clients:[e.parent],entity:'studio',record:e.id,project:null,title:e.name,before:null,after:{name:e.name,value:e.value},action:'update_studio',batch:'fixture-batch',at:Math.floor(Date.now()/1000)}));if(command==='clients_initialise'){if(library.studio.some(e=>e.kind==='client'))return false;for(const [id,name,pid] of [['client:aanzpa','AANZPA',7],['client:hoea-to-waka','Hoea tō Waka',8]])if(!library.studio.some(e=>e.id===id))library.studio.push({...blankEntry('client',name),id,projects:[pid],status:'active'});return true;}if(command==='get_library')return structuredClone(library);if(command.startsWith('plugin:event|'))return ++cb;if(command==='storage_usage')return{bytes:100,data_bytes:0,library_bytes:100,app_bytes:0};if(['save_library_preferences','diagnostics_record','discard_capture'].includes(command))return;if(command==='read_clipboard')return{files:[],url:'https://example.com/proposal'};
if(command==='capture_items_progress'){history.push(structuredClone(library));const id=library.items.length+1;library.items.push({id,path:args.input.url,name:'Proposal reference',kind:'link',source:'',project_only:true,projects:[{id:7,name:'AANZPA',count:0},{id:8,name:'Hoea tō Waka',count:0}],tags:[],modified:1,added:1,missing:false});library.studio.find(e=>e.id===args.input.studio).files.push(id);return{ids:[id],added:1,reused:0};}
if(command==='update'){const c=args.change;if(c.action==='undo_organisation'){redo.push(structuredClone(library));library=history.pop();return;}if(c.action==='redo_organisation'){history.push(structuredClone(library));library=redo.pop();return;}if(fail){fail=false;throw Error('Simulated save failure');}history.push(structuredClone(library));library.undo_label='Edit studio record';if(c.action==='setup_clients'){for(const [id,name,pid] of [['client:aanzpa','AANZPA',7],['client:hoea-to-waka','Hoea tō Waka',8]])if(!library.studio.some(e=>e.id===id))library.studio.push({...blankEntry('client',name),id,projects:[pid],status:'active'});return;}if(c.action==='update_studio'){const v=JSON.parse(c.value);let e=library.studio.find(e=>e.id===v.id);if(!e){e={...blankEntry(v.patch.kind,v.patch.name),id:v.id};library.studio.push(e);}Object.assign(e,v.patch);e.updated=Date.now();}if(['convert_studio_lead','win_studio_lead'].includes(c.action)){const e=library.studio.find(e=>e.id===c.value);e.status='won';library.projects.push({id:7,name:e.name,count:0});e.projects.push(7);e.handover_project=7;e.actions=e.actions.filter(a=>a.done);}return;}
return null;}};
localStorage.clear();localStorage.setItem('onboarding',JSON.stringify({enabled:false,leadsSeen:true}));let root=createRoot(document.getElementById('root'));root.render(React.createElement(App));
const pause=ms=>new Promise(r=>setTimeout(r,ms));const assert=(value,message)=>{if(!value)throw Error(message);};async function until(fn,label){for(let i=0;i<160;i++){if(fn())return;await pause(30);}throw Error('Timed out: '+label);}
const button=(text,scope=document)=>[...scope.querySelectorAll('button')].find(b=>b.textContent.trim()===text);const fill=(el,value)=>{assert(el,'Missing field');const proto=el.tagName==='TEXTAREA'?HTMLTextAreaElement.prototype:el.tagName==='SELECT'?HTMLSelectElement.prototype:HTMLInputElement.prototype;Object.getOwnPropertyDescriptor(proto,'value').set.call(el,value);el.dispatchEvent(new Event(el.tagName==='SELECT'?'change':'input',{bubbles:true}));};
async function field(label,value){const el=document.querySelector(`[aria-label="${label}"]`);el.focus();fill(el,value);await pause(30);el.blur();await pause(120);}
try{
await until(()=>document.querySelector('[aria-label="Clients"]'),'Clients section');document.querySelector('[aria-label="Clients"]').click();await until(()=>document.querySelector('.clients-profiles button'),'Seeded profiles');assert(library.studio.filter(e=>e.kind==='client').length===2,'Two clients only');assert(document.querySelector('.section-leads').nextElementSibling.dataset.section==='Clients','Clients between Leads and Projects');button('AANZPA',document.querySelector('.section-clients')).click();await until(()=>document.querySelector('[aria-label="Client name"]'),'Client profile');const canvas=document.createElement('canvas');canvas.width=160;canvas.height=120;const ctx=canvas.getContext('2d');ctx.fillStyle='#215e78';ctx.fillRect(0,0,160,120);const blob=await new Promise(resolve=>canvas.toBlob(resolve));const transfer=new DataTransfer();transfer.items.add(new File([blob],'client.png',{type:'image/png'}));document.querySelector('.client-avatar-control').dispatchEvent(new DragEvent('drop',{bubbles:true,cancelable:true,dataTransfer:transfer}));await until(()=>document.querySelector('.client-crop'),'Picture crop');button('Save picture').click();await until(()=>library.studio.find(e=>e.id==='client:aanzpa').avatar?.startsWith('data:image/png;base64,'),'Avatar saved');document.querySelector('.clients-profile-details').open=true;await pause(40);await field('Be aware of · pinned notes','Approval required before publishing');assert(library.studio.find(e=>e.id==='client:aanzpa').body.includes('Approval'),'Pinned note saved');
button('Tasks',document.querySelector('.clients-tabs')).click();await until(()=>document.querySelector('[aria-label="New client task"]'),'Tasks');fill(document.querySelector('[aria-label="New client task"]'),'Prepare options');await pause(40);button('Add task').click();await until(()=>document.querySelector('[aria-label="Complete Prepare options"]'),'Task created');document.querySelector('[aria-label="Complete Prepare options"]').click();await until(()=>library.studio.find(e=>e.id==='client:aanzpa').actions[0].done,'Task complete');
button('Pricing',document.querySelector('.clients-tabs')).click();await until(()=>document.querySelector('[aria-label="Quote title"]'),'Pricing');fill(document.querySelector('[aria-label="Quote title"]'),'Brand proposal');await pause(40);button('Add quote').click();await until(()=>document.querySelector('[aria-label="Amount"]'),'Quote editor');await field('Amount','2500');await field('Currency','NZD');await field('Tax treatment','GST exclusive');assert(library.studio.find(e=>e.name==='Brand proposal').value===2500,'Amount saved');
button('Meetings',document.querySelector('.clients-tabs')).click();await until(()=>document.querySelector('[aria-label="Meeting title"]'),'Meetings');fill(document.querySelector('[aria-label="Meeting title"]'),'Review concepts');await pause(40);button('Add meeting').click();await until(()=>document.querySelector('[aria-label="Time"]'),'Meeting editor');await field('Time','10:30');await field('Attendees','Client team');await field('Agenda · what to discuss','Review direction');fill(document.querySelector('[aria-label="Review beforehand item"]'),'Read brief');await pause(40);document.querySelector('[aria-label="Review beforehand item"]').closest('form').dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));await until(()=>library.studio.find(e=>e.name==='Review concepts').actions.length===1,'Preparation saved');
button('Files',document.querySelector('.clients-tabs')).click();await until(()=>!document.querySelector('.clients-record')&&button('Paste here',document.querySelector('.clients-files')),'Files tab');button('Paste here',document.querySelector('.clients-files')).click();await until(()=>library.studio.find(e=>e.id==='client:aanzpa').files.length===1,'Private client attachment');assert(library.items[0].project_only,'Client attachment remains private');
document.querySelector('[aria-label="Back to Dashboard"]').click();await until(()=>document.querySelector('.clients-profiles'),'Today');assert(document.querySelector('.clients-batch'),'Grouped activity');window.__screenshotReady=true;await pause(600);assert(library.studio.filter(e=>e.kind==='client').length===2,'Seed idempotent');
document.getElementById('check-result').textContent=JSON.stringify({ok:true,checks:['Clients section placement; seed; profile; pinned note; task complete; quote amount; meeting details and preparation; private queued attachments; Today navigation']});
}catch(error){document.getElementById('check-result').textContent=JSON.stringify({ok:false,error:String(error)});}
</script></body></html>
