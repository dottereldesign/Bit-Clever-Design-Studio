<!doctype html><html><head><meta charset="UTF-8"><title>Hover preview readiness</title></head><body><div id="root"></div><pre id="check-result" hidden>pending</pre><script type="module">
import React,{useLayoutEffect,useState} from 'react';import {createRoot} from 'react-dom/client';import HoverPreview from '/src/HoverPreview.tsx';import '/src/style.css';
const poster='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320"><rect width="480" height="320" fill="#284d43"/></svg>');
let show,configure,initial=[];function Preview({src,animation}){useLayoutEffect(()=>{initial.push(getComputedStyle(document.querySelector('.hover-preview')).opacity);},[]);return React.createElement(HoverPreview,{src,animation,onError:()=>show(false)});}
function Test(){const [active,setActive]=useState(false),[config,setConfig]=useState({src:poster,animation:true});show=setActive;configure=setConfig;return React.createElement('article',{className:'card',style:{width:480,height:320,margin:40}},React.createElement('img',{id:'poster',src:poster,alt:'Poster'}),active&&React.createElement(Preview,{key:config.src,...config}));}
createRoot(document.getElementById('root')).render(React.createElement(Test));
const pause=ms=>new Promise(r=>setTimeout(r,ms)),assert=(ok,message)=>{if(!ok)throw Error(message);};async function until(test,message){for(let i=0;i<500;i++){if(test())return;await pause(20);}throw Error(message);}
try{
 await until(()=>show&&document.querySelector('#poster')?.complete,'Poster');const original=document.querySelector('#poster');
 show(true);await until(()=>document.querySelector('.hover-preview.is-ready'),'Image preview ready');assert(initial.at(-1)==='0','Image preview exposed before load');assert(document.querySelector('#poster')===original,'Poster replaced');
 show(false);await until(()=>!document.querySelector('.hover-preview'),'Leave hover');show(true);await until(()=>initial.length===2&&document.querySelector('.is-ready'),'Repeat hover');assert(initial.at(-1)==='0','Repeated hover reused stale readiness');
 show(false);await until(()=>!document.querySelector('.hover-preview'),'Reset');
 const canvas=document.createElement('canvas');canvas.width=480;canvas.height=320;const ctx=canvas.getContext('2d');const stream=canvas.captureStream(20),chunks=[];const recorder=new MediaRecorder(stream,{mimeType:'video/webm'});recorder.ondataavailable=e=>chunks.push(e.data);const finished=new Promise(r=>recorder.onstop=r);recorder.start();for(let i=0;i<10;i++){ctx.fillStyle=i%2?'#456d5d':'#355b50';ctx.fillRect(0,0,480,320);await pause(50);}recorder.stop();await finished;stream.getTracks().forEach(t=>t.stop());const url=URL.createObjectURL(new Blob(chunks,{type:'video/webm'}));configure({src:url,animation:false});show(true);
 await until(()=>document.querySelector('video.is-ready'),'First video frame ready');assert(initial.at(-1)==='0','Video exposed before first frame');assert(document.querySelector('#poster')===original,'Video removed poster');assert(getComputedStyle(document.querySelector('video')).backgroundColor==='rgba(0, 0, 0, 0)','Opaque preview background');
 window.__screenshotReady=true;await pause(400);show(false);await until(()=>!document.querySelector('video'),'Video removed after hover');URL.revokeObjectURL(url);
 configure({src:'data:image/gif;base64,broken',animation:true});show(true);await until(()=>initial.length===4&&!document.querySelector('.hover-preview'),'Decode failure fallback');assert(document.querySelector('#poster')===original,'Error removed poster');
 document.getElementById('check-result').textContent=JSON.stringify({ok:true,checks:['Image previews stay hidden until loaded','Video previews wait for a presented frame','Repeated hovers reset readiness','Poster remains throughout loading and failures']});
}catch(error){document.getElementById('check-result').textContent=JSON.stringify({ok:false,error:String(error)});}
</script></body></html>
