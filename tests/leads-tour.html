<!doctype html><html><head><meta charset="UTF-8"></head><body><div id="root"></div><pre id="check-result" hidden>pending</pre><script type="module">
import React from 'react';import{createRoot}from'react-dom/client';import App from '/src/App.tsx';import{blankEntry}from'/src/studio.ts';import{appHistory}from'/src/appHistory.ts';import '/src/style.css';
let library={items:[],studio:[],projects:[],tags:[],categories:[],sources:[],root:'C:/mock',scanning:false};let cb=0;let fail=false;const history=[],redo=[],calls=[];
window.isTauri=true;window.__TAURI_INTERNALS__={transformCallback:()=>++cb,convertFileSrc:x=>x,invoke:async(command,args)=>{calls.push({command,args});if(command==='get_library')return structuredClone(library);if(command.startsWith('plugin:event|'))return ++cb;if(command==='storage_usage')return{bytes:100,data_bytes:0,library_bytes:100,app_bytes:0};if(['save_library_preferences','diagnostics_record','discard_capture'].includes(command))return;if(command==='read_clipboard')return{files:[],url:'https://example.com/proposal'};
if(command==='capture_items_progress'){history.push(structuredClone(library));const id=library.items.length+1;library.items.push({id,path:args.input.url,name:'Proposal reference',kind:'link',source:'',project_only:true,projects:[],tags:[],modified:1,added:1,missing:false});library.studio.find(e=>e.id===args.input.studio).files.push(id);return{ids:[id],added:1,reused:0};}
if(command==='update'){const c=args.change;if(c.action==='undo_organisation'){redo.push(structuredClone(library));library=history.pop();return;}if(c.action==='redo_organisation'){history.push(structuredClone(library));library=redo.pop();return;}if(fail){fail=false;throw Error('Simulated save failure');}history.push(structuredClone(library));library.undo_label='Edit studio record';if(c.action==='update_studio'){const v=JSON.parse(c.value);let e=library.studio.find(e=>e.id===v.id);if(!e){e={...blankEntry(v.patch.kind,v.patch.name),id:v.id};library.studio.push(e);}Object.assign(e,v.patch);e.updated=Date.now();}if(['convert_studio_lead','win_studio_lead'].includes(c.action)){const e=library.studio.find(e=>e.id===c.value);e.status='won';library.projects.push({id:7,name:e.name,count:0});e.projects.push(7);e.handover_project=7;e.actions=e.actions.filter(a=>a.done);}return;}
return null;}};
localStorage.clear();localStorage.setItem('sidebar-section-colours',JSON.stringify({leads:'#008877'}));library.studio=[{...blankEntry('lead','Example website project'),status:'won',projects:[7],handover_project:7}];library.projects=[{id:7,name:'Example website project',count:0}];let root=createRoot(document.getElementById('root'));root.render(React.createElement(App));
const pause=ms=>new Promise(r=>setTimeout(r,ms));const assert=(value,message)=>{if(!value)throw Error(message);};async function until(fn,label){for(let i=0;i<160;i++){if(fn())return;await pause(30);}throw Error('Timed out: '+label);}
const button=(text,scope=document)=>[...scope.querySelectorAll('button')].find(b=>b.textContent.trim()===text);const fill=(el,value)=>{assert(el,'Missing field');const proto=el.tagName==='TEXTAREA'?HTMLTextAreaElement.prototype:el.tagName==='SELECT'?HTMLSelectElement.prototype:HTMLInputElement.prototype;Object.getOwnPropertyDescriptor(proto,'value').set.call(el,value);el.dispatchEvent(new Event(el.tagName==='SELECT'?'change':'input',{bubbles:true}));};
async function field(label,value){const el=document.querySelector(`[aria-label="${label}"]`);el.focus();fill(el,value);await pause(30);el.blur();await pause(120);}
try{
await until(()=>document.querySelector('[aria-label="Leads"]'),'Sidebar');if(document.querySelector('[aria-label="Leads"]').getAttribute('aria-expanded')!=='true')document.querySelector('[aria-label="Leads"]').click();document.querySelector('.section-leads .nav-item').click();await until(()=>document.querySelector('[aria-label="Leads walkthrough"]'),'First visit');
assert(document.querySelector('.tour-mascot'),'Mascot');assert(document.querySelector('.tour-pointer path[marker-end]'),'Arrow');assert(document.querySelector('.leads-tour').style.getPropertyValue('--tour-colour').includes('#008877'),'Leads colour');
await pause(120);assert(document.querySelector('.tour-mascot.is-talking'),'Talking during typing');assert(getComputedStyle(document.querySelector('.tour-mascot-frames')).backgroundImage.includes('talking-sheet.svg'),'Talking SVG sheet');
const box=document.querySelector('.tour-card').getBoundingClientRect(),target=document.querySelector('.studio-tabs').getBoundingClientRect();assert(box.top>=target.bottom&&box.top-target.bottom<=24,'Dialogue sits immediately beside target');assert(box.right<=innerWidth&&box.bottom<=innerHeight,'Dialogue fits viewport');
await pause(1600);assert(!document.querySelector('.tour-mascot.is-talking'),'Idle after typing');assert(getComputedStyle(document.querySelector('.tour-mascot-frames')).backgroundImage.includes('idle-sheet.svg'),'Idle SVG sheet');
for(const mode of ['idle','talking']){const svg=await(await fetch(`/mascot/${mode}-sheet.svg`)).text();const doc=new DOMParser().parseFromString(svg,'image/svg+xml');assert(doc.documentElement.getAttribute('viewBox')==='0 0 720 900','3 by 3 sheet canvas');assert(doc.documentElement.children.length===9,'Nine vector frames');assert(!svg.includes('<image'),'Pure vectors');}
window.__screenshotReady=true;await pause(1000);
const mutations=()=>calls.filter(c=>c.command==='update').length;const before=mutations();
for(let i=0;i<6;i++){button('Next',document.querySelector('.tour-card')).click();await pause(160);const r=document.querySelector('.tour-card').getBoundingClientRect();assert(r.left>=0&&r.right<=innerWidth&&r.top>=0&&r.bottom<=innerHeight,'Each step fits');}
assert(document.querySelector('.tour-card').textContent.includes('Ready when you are'),'All steps');assert(mutations()===before,'Tour must not change records');button('Got it').click();await until(()=>!document.querySelector('.tour-card'),'Complete');assert(JSON.parse(localStorage.getItem('onboarding')).leadsSeen,'Completion saved');
document.querySelector('[aria-label="Settings"]').click();await until(()=>document.querySelector('.onboarding-settings'),'Settings');appHistory.write({'reduce-motion':true});button('Replay Leads walkthrough').click();await until(()=>document.querySelector('.tour-card'),'Replay');assert(!document.querySelector('.settings-page'),'Replay leaves Settings');assert(document.querySelector('.leads-tour').dataset.still==='true','Reduced motion respected');assert(!document.querySelector('.tour-mascot.is-talking'),'Reduced motion stops talking');document.querySelector('[aria-label="Skip walkthrough"]').click();await pause(100);
document.querySelector('[aria-label="Settings"]').click();await until(()=>document.querySelector('.onboarding-settings'),'Settings again');document.querySelector('.onboarding-settings input').click();await pause(80);assert(!JSON.parse(localStorage.getItem('onboarding')).enabled,'Disable saved');
root.unmount();root=createRoot(document.getElementById('root'));root.render(React.createElement(App));await until(()=>document.querySelector('[aria-label="Leads"]'),'Remount');if(document.querySelector('[aria-label="Leads"]').getAttribute('aria-expanded')!=='true')document.querySelector('[aria-label="Leads"]').click();document.querySelector('.section-leads .nav-item').click();await pause(250);assert(!document.querySelector('.tour-card'),'Disabled persists');
document.getElementById('check-result').textContent=JSON.stringify({ok:true,checks:['First visit; mascot and colour-matched arrows; seven steps; no record writes; completion; Settings replay and disable; remount']});
}catch(error){document.getElementById('check-result').textContent=JSON.stringify({ok:false,error:String(error)});}
</script></body></html>
