<!doctype html><html><head><meta charset="UTF-8"></head><body><main style="max-width:900px;margin:30px auto"><div id="root"></div></main><pre id="check-result" hidden>pending</pre><script type="module">

let status={connected:false,last_sync:0,meetings:[meeting]},applied=0,failed=false;const logs=[];
window.isTauri=true;window.__TAURI_INTERNALS__={invoke:async(command,args)=>{
 if(command==='calendar_initialise')return status;if(command==='diagnostics_record'){logs.push(...args.events);return;}

 if(command==='calendar_apply'){applied++;status={...status,last_sync:1794520000,meetings:args.meetings};return status;}return null;
}};
const refresh=async()=>{};function Test(){useCalendarSync(true,refresh);return React.createElement(CalendarConnection);}const root=createRoot(document.getElementById('root'));root.render(React.createElement(Test));
const pause=ms=>new Promise(r=>setTimeout(r,ms));const button=t=>[...document.querySelectorAll('button')].find(b=>b.textContent===t);async function until(fn){for(let n=0;n<200;n++){if(fn())return;await pause(20);}throw Error('Timed out');}

ble');card.click();await until(()=>button('Open in Google Calendar'));if(button('Archive')||document.querySelector('[aria-label="Name"]'))throw Error('Synced meeting is editable');document.querySelector('[aria-label="Back"]').click();await until(()=>document.querySelector('.studio-calendar'));window.__screenshotReady=true;await pause(700);document.getElementById('check-result').textContent=JSON.stringify({ok:true,checks:['Connect and selected-meeting sync','Failure preserves saved meetings','Retry','Disconnect retains meetings','Credential excluded from diagnostics','Read-only calendar card and meeting details']});}catch(error){document.getElementById('check-result').textContent=JSON.stringify({ok:false,error:String(error)});}
