<!doctype html><html><head><meta charset="UTF-8"></head><body><div id="root"></div><pre id="check-result" hidden>pending</pre><script type="module">
import React from 'react';import{createRoot}from'react-dom/client';import Navigation from '/src/SidebarNavigation.tsx';import Section from '/src/SidebarSection.tsx';import{appHistory}from'/src/appHistory.ts';import{collectBackupPreferences}from'/src/backupPreferences.ts';import '/src/style.css';import '/src/sectionStyles.css';import '/src/appearance.css';
const names=['Marketing','Leads','Projects','General','Categories','Components','Research'];const identities=['marketing','leads','projects','general','design','components','research'];names.forEach(n=>localStorage.setItem('sidebar-open:'+n,'false'));
let root=createRoot(document.getElementById('root'));function render(){root.render(React.createElement('div',{className:'app'},React.createElement('aside',{className:'sidebar',style:{height:'100vh',width:290}},React.createElement(Navigation,{order:['General','Projects','Categories','Components']},names.map((name,i)=>React.createElement(Section,{key:name,name,identity:identities[i],styleId:21,action:React.createElement('button',{title:'Add '+name},'+')},React.createElement('button',null,'Content')))))));};render();
const pause=ms=>new Promise(r=>setTimeout(r,ms)),assert=(v,m)=>{if(!v)throw Error(m);};async function until(f,m){for(let n=0;n<200;n++){if(f())return;await pause(30);}throw Error(m);}
const order=()=>[...document.querySelectorAll('.sidebar-scroll>[data-section]')].map(e=>e.dataset.section);const heading=n=>document.querySelector(`[data-section="${n}"] .section-toggle`);const point=n=>{const r=heading(n).getBoundingClientRect();return{x:r.left+65,y:r.top+r.height/2};};let id=0;
async function drag(from,to,escape=false){window.__pointerAction={id:++id,from:point(from),to,escape,pause:80};await until(()=>window.__pointerActionDone===id,'Pointer action');await pause(450);}
try{await until(()=>heading('Research'),'Render');await drag('Marketing',{...point('Research'),y:point('Research').y+18});assert(order().at(-1)==='Marketing','Move first to last');assert(heading('Marketing').getAttribute('aria-expanded')==='false','Drag must not toggle');assert(!document.querySelector('.sidebar-order-overlay'),'Overlay cleaned');assert(collectBackupPreferences()['sidebar-section-order'].at(-1)==='Marketing','Backup order');await appHistory.undo();await pause(50);assert(order()[0]==='Marketing','Undo');await appHistory.redo();await pause(50);assert(order().at(-1)==='Marketing','Redo');await drag('Marketing',point('Leads'),true);assert(order().at(-1)==='Marketing','Escape keeps order');await drag('Marketing',{x:700,y:100});assert(order().at(-1)==='Marketing','Outside cancels');
heading('Marketing').closest('.sidebar-heading').dispatchEvent(new MouseEvent('contextmenu',{bubbles:true,clientX:70,clientY:90}));await pause(40);[...document.querySelectorAll('button')].find(b=>b.textContent==='Move up').click();await pause(450);assert(order().at(-2)==='Marketing','Menu move');
const before=heading('General').getAttribute('aria-expanded');heading('General').click();await pause(50);assert(heading('General').getAttribute('aria-expanded')!==before,'Normal click still works');
root.unmount();root=createRoot(document.getElementById('root'));render();await until(()=>heading('Marketing'),'Remount');assert(order().at(-2)==='Marketing','Order survives remount');assert(JSON.parse(localStorage.getItem('sidebar-section-order')).at(-2)==='Marketing','Persisted');heading('Marketing').dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowUp',altKey:true,bubbles:true,cancelable:true}));await pause(450);assert(order().at(-3)==='Marketing','Keyboard move');window.__screenshotReady=true;document.getElementById('check-result').textContent=JSON.stringify({ok:true,checks:['native pointer reorder, no toggle, undo/redo, cancel, outside drop, menu, remount, backup']});}catch(e){document.getElementById('check-result').textContent=JSON.stringify({ok:false,error:String(e)});}
</script></body></html>
